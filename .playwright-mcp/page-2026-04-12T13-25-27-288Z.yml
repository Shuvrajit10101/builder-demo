        - generic [ref=e53]:
          - paragraph [ref=e54]: For over four decades, Task Constructions has been synonymous with quality craftsmanship in the hills of Himachal Pradesh. Founded in 1985, we have shaped Shimla's residential landscape with an unwavering commitment to building homes that endure generations — not just seasons.
          - paragraph [ref=e55]: "Our expertise spans the full spectrum of mountain construction: traditional Himachali cottages, stone-and-mortar fireplaces built to withstand sub-zero winters, and Shimla's iconic slate roofing that has sheltered families for over a century. Every project carries the weight of our reputation — and we carry it proudly."
          - paragraph [ref=e56]: "Today, we bring that same heritage of excellence to a new chapter: premium attic living spaces in Aman Vihar, Tutikandi. These are not ordinary apartments — they are handcrafted sky-homes, designed with the same care and mastery we have applied to every structure we have ever built in these mountains."
